name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Expo Prebuild (generate android folder)
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: '1'
        run: |
          npx expo prebuild --platform android --clean --no-install
      - name: Set version from app.json
        run: |
          VERSION_CODE=$(node -e "const a=require('./app.json'); console.log(a.expo.android.versionCode)")
          VERSION_NAME=$(node -e "const a=require('./app.json'); console.log(a.expo.version)")
          echo "versionCode=$VERSION_CODE, versionName=$VERSION_NAME"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle | head -5
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-sdk54-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-sdk54-
      - name: Bundle JS for release
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: '1'
          NODE_ENV: production
        run: |
          mkdir -p android/app/src/main/assets
          npx @react-native-community/cli bundle \
            --platform android \
            --dev false \
            --entry-file index.ts \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
      - name: Build Release APK
        env:
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: '1'
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jtpower-bybit-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
